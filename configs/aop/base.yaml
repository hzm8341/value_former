# Action Outcome Predictor V0 config.
# Source: R&D plan V3.2, Section 1.3, 4.1-4.4, Phase 4.
horizon_seconds: 0.5          # H in [0.25, 1.0]s, task config not a paper parameter

state_repr_dim: 256           # reuse ValueFormer causal-transformer last-token repr
action_dim: 8                 # [dx,dy,dz,drx,dry,drz,gripper,dt]

heads:
  delta_progress: 1
  p_jam: 1
  p_slip: 1
  p_success_h: 1
  delta_ee_pose: 6
  delta_insertion_depth: 1
  contact_transition: 11       # logits over ContactState (labels/contact_labels.py)

ranking_weights:               # Score = w1*dProgress - w2*P(Jam) - w3*P(Slip) + w4*P(Success_H)
  w_progress: 1.0
  w_jam: 1.0
  w_slip: 0.5
  w_success: 1.0

candidate_generator:
  n_perturbations: 4
  max_cartesian_step_m: 0.01
  max_rotation_step_rad: 0.1

safety_envelope:
  workspace_xyz_min: [-0.5, -0.5, 0.0]
  workspace_xyz_max: [0.5, 0.5, 0.5]
  max_cartesian_step_m: 0.02
  max_rotation_step_rad: 0.2
