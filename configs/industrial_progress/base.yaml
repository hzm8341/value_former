# Industrial Track config: non-monotonic Physical Progress potential.
# Source: R&D plan V3.2, Section 2.4. Weights/sigmas are pilot defaults (20-30 episode
# calibration set) -- must be re-fit per task/fixture and re-versioned, not treated as ground truth.
label_version: "industrial_progress_v0"

model:
  d_model: 256
  n_layers: 2
  n_heads: 4
  seq_len: 16

normalization:
  sigma_d: 0.15        # approach distance normalization (m)
  sigma_xy: 0.01        # lateral alignment error normalization (m)
  sigma_rot: 0.15        # angular alignment error normalization (rad)
  d_goal: 0.03            # target insertion depth (m)

weights:
  w_approach: 0.15
  w_align: 0.15
  w_depth: 0.4
  w_contact: 0.3
  w_jam: 0.6
  w_slip: 0.4
  w_overload: 0.6

temporal:
  ema_alpha: 0.3            # short EMA for normal frames
  jam_immediate: true        # apply jam/overload penalty without smoothing
  allow_recovery: true       # explicitly disallow cumulative-max monotonic clamp

terminal_override:
  fully_seated_value: 1.0
  hard_abort_value: 0.0
